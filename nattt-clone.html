<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nattt — CTF Writeups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f4f0e6;
    --cream-2: #ece6d6;
    --ink: #1c1a15;
    --ink-soft: #55503f;
    --rule: #ddd5bd;
    --terracotta: #c1501f;
    --terracotta-soft: #e9c9b4;
    --card: #fbf9f2;
    --code-bg: #17150f;
    --code-text: #f2ead9;
    --green: #4d7a4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.55;
  }
  a{color:inherit;text-decoration:none;}
  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--cream-2);
    border-right:1px solid var(--rule);
    padding:22px 16px 40px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:2px 6px 20px;
    border-bottom:1px solid var(--rule);
    margin-bottom:16px;
  }
  .brand img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);}
  .brand span{
    font-family:'Playfair Display',serif;
    font-weight:700;font-size:20px;letter-spacing:0.2px;
  }
  .nav-section{margin-bottom:6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:6px;
    font-size:13.5px;font-weight:500;color:var(--ink-soft);
    cursor:pointer;
  }
  .nav-item:hover{background:rgba(0,0,0,0.04);color:var(--ink);}
  .nav-item.active{background:var(--ink);color:var(--cream);}
  .nav-item .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0;}
  .nav-label{margin-top:22px;margin-bottom:6px;padding:0 10px;
    font-size:10.5px;font-weight:700;letter-spacing:0.08em;
    color:#8a8368;text-transform:uppercase;}
  .nav-item .count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8a8368;}
  .nav-item.active .count{color:var(--terracotta-soft);}
  .event-list{max-height:none;}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:16px 32px;border-bottom:1px solid var(--rule);
    position:sticky;top:0;background:var(--cream);z-index:5;
  }
  .search{
    flex:1;max-width:520px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--rule);
    border-radius:8px;padding:9px 14px;color:#9a927a;font-size:13.5px;
  }
  .search kbd{
    margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;
    background:var(--cream-2);border:1px solid var(--rule);border-radius:4px;
    padding:2px 6px;color:var(--ink-soft);
  }
  .top-right{display:flex;align-items:center;gap:14px;color:var(--ink-soft);}
  .avatar-dot{width:30px;height:30px;border-radius:50%;background:var(--terracotta);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}

  .content{flex:1;display:flex;}
  .col-main{flex:1;padding:34px 40px 80px;max-width:900px;}
  .col-toc{width:280px;flex-shrink:0;padding:34px 24px 40px;border-left:1px solid var(--rule);}

  h1.page-title{
    font-family:'Playfair Display',serif;font-weight:700;
    font-size:36px;display:flex;align-items:center;gap:14px;margin:0 0 18px;
  }
  .divider{border:none;border-top:1px solid var(--rule);margin:18px 0 26px;}
  .lede{font-size:17px;font-style:italic;color:var(--ink-soft);max-width:640px;margin:0 0 20px;font-family:'Playfair Display',serif;}
  p{color:var(--ink-soft);}
  .note{font-style:italic;color:#8a8368;font-size:13.5px;}

  /* stat cards */
  .stat-row{display:flex;gap:20px;margin:28px 0 40px;flex-wrap:wrap;}
  .card{
    background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px;
  }
  .card-country{flex:1;min-width:220px;display:flex;align-items:center;gap:14px;}
  .flag{width:34px;height:24px;border-radius:2px;background:linear-gradient(#c1501f 50%, #fff 50%);border:1px solid var(--rule);}
  .card-country .cc-label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8a8368;font-weight:600;}
  .card-country .cc-name{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;}

  .card-rank{flex:2;min-width:340px;position:relative;}
  .card-rank .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8368;font-weight:700;margin-bottom:14px;}
  .rank-grid{display:flex;gap:34px;align-items:baseline;}
  .rank-grid .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;}
  .rank-grid .num.hot{color:var(--terracotta);}
  .rank-grid .num.green{color:var(--green);}
  .rank-grid .lbl{display:block;font-size:10.5px;color:#8a8368;font-weight:600;margin-top:2px;letter-spacing:0.03em;}
  .card-rank .ext-link{position:absolute;top:20px;right:22px;font-size:12px;color:var(--terracotta);font-weight:600;}

  h2.section-title{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;margin:36px 0 16px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:#8a8368;font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--rule);
  }
  tbody td{padding:14px 12px;border-bottom:1px solid var(--rule);color:var(--ink-soft);}
  tbody tr:hover{background:rgba(193,80,31,0.04);}
  .ev-name{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px;}
  .ev-name .ic{color:var(--terracotta);}
  td.mono, .rank-strong{font-family:'JetBrains Mono',monospace;}
  .rank-strong{font-weight:700;color:var(--ink);}
  .dash{color:#b3ab8f;}
  .team-pill{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    background:var(--cream-2);border:1px solid var(--rule);border-radius:4px;
    padding:3px 8px;letter-spacing:0.02em;
  }

  /* ---------- TOC ---------- */
  .toc-head{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--terracotta);
    font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .toc-head::before{content:"";width:3px;height:14px;background:var(--terracotta);display:inline-block;border-radius:2px;}
  .toc-group{margin-bottom:22px;}
  .toc-cat{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8a8368;font-weight:700;margin-bottom:8px;}
  .toc-link{display:block;padding:5px 10px;margin-left:-10px;border-radius:5px;font-size:13px;color:var(--ink-soft);border-left:2px solid transparent;}
  .toc-link:hover{color:var(--ink);}
  .toc-link.active{color:var(--terracotta);border-left:2px solid var(--terracotta);background:rgba(193,80,31,0.06);font-weight:600;}

  /* ---------- Event page ---------- */
  .breadcrumb-note{color:var(--ink-soft);font-size:14.5px;margin-bottom:6px;}
  .meta-count{display:flex;gap:36px;margin:12px 0 22px;}
  .meta-count .n{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;}
  .meta-count .l{display:block;font-size:11.5px;color:#8a8368;}

  .cat-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8368;font-weight:700;margin:30px 0 6px;}
  h3.writeup-title{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;margin:0 0 14px;}
  .meta-row{
    display:flex;gap:26px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--rule);
    font-size:12.5px;color:#8a8368;
  }
  .meta-row b{color:var(--ink);font-weight:600;}
  .meta-row .diff{color:var(--terracotta);font-weight:700;}

  .desc-box{
    background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:20px 22px;margin-bottom:22px;
    color:var(--ink-soft);
  }
  .desc-box code, .inline-code{
    background:var(--code-bg);color:var(--code-text);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;
    padding:2px 7px;border-radius:4px;
  }
  .step-tag{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
    color:#fff;background:var(--terracotta);border-radius:4px;padding:2px 7px;margin-right:10px;letter-spacing:0.04em;
  }
  .step-title{font-weight:700;font-size:15px;}
  .step-block{margin:18px 0;}
  .code-block{
    position:relative;background:var(--code-bg);color:var(--code-text);
    font-family:'JetBrains Mono',monospace;font-size:13px;
    border-radius:8px;padding:16px 18px;margin:10px 0 20px;
  }
  .copy-btn{
    position:absolute;top:10px;right:12px;font-size:10.5px;font-weight:700;
    background:#2a2719;color:#cfc7ad;border:none;border-radius:5px;padding:5px 10px;
    letter-spacing:0.05em;cursor:pointer;
  }
  .copy-btn:hover{background:#3a3624;}
  .flag-box{
    display:flex;align-items:center;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--rule);margin-top:10px;
  }
  .flag-box .tag{background:var(--terracotta);color:#fff;font-weight:700;font-size:11.5px;padding:12px 16px;letter-spacing:0.05em;}
  .flag-box .val{flex:1;background:var(--code-bg);color:#f0c9a8;font-family:'JetBrains Mono',monospace;font-size:13px;padding:12px 16px;}
  .flag-box .copy-btn{position:static;background:var(--cream-2);color:var(--ink-soft);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9c1a6;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:980px){
    .col-toc{display:none;}
    .sidebar{width:200px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <img src="https://api.dicebear.com/7.x/notionists/svg?seed=nattt" alt="">
      <span>Nattt</span>
    </div>

    <div class="nav-section">
      <div class="nav-item" data-route="#/" id="nav-home"><span class="ic">🏠</span>Home</div>
      <div class="nav-item"><span class="ic">B'</span>Blog</div>
      <div class="nav-item"><span class="ic">🎮</span>Game</div>
    </div>

    <div class="nav-label">CTF Event Writeups</div>
    <div class="nav-section event-list" id="event-list"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="search">🔍 Search archive… <kbd>Ctrl K</kbd></div>
      <div class="top-right">
        <span>▶️ 🔊</span>
        <div class="avatar-dot">M</div>
        <span>🐙</span>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<script>
const events = [
  {id:"v1tctf", name:"V1tCtf", icon:"🔑", writeups:27},
  {id:"tracebash", name:"Tracebash", icon:"🧵", writeups:27},
  {id:"tjcsc", name:"TJCSC", icon:"📔", writeups:20},
  {id:"them2026", name:"THEM 2026", icon:"📄", writeups:27},
  {id:"thcon2026", name:"THCON 2026", icon:"🚩", writeups:14},
  {id:"squ1rrel", name:"Squ1rrel", icon:"🐿️", writeups:8},
  {id:"siebersec", name:"SiebersecCTF", icon:"🛡️", writeups:5},
  {id:"ram", name:"RAM", icon:"🚩", writeups:20},
  {id:"r3ctf", name:"R3CTF", icon:"🐾", writeups:15},
  {id:"putcyber", name:"Putcyber", icon:"🧭", writeups:2},
  {id:"projectsekai", name:"ProjectSekai 2026", icon:"🎵", writeups:15},
  {id:"nohacknoctf", name:"NoHackNoCTF", icon:"🧭", writeups:22},
  {id:"lyknctf", name:"LyknCTF 2026", icon:"🌀", writeups:43},
  {id:"k1nd4sus", name:"K1nd4sus", icon:"🎭", writeups:4},
  {id:"jerseyctf", name:"JerseyCTF", icon:"🔒", writeups:31},
  {id:"boroctf", name:"BoroCTF", icon:"🎓", writeups:52},
];

const perf = [
  {name:"V1tCtf", icon:"🔑", solves:27, cats:7, latest:"2026-07-08", rank:"—", points:"—", team:"ROBLOX-LABS"},
  {name:"Tracebash", icon:"🧵", solves:27, cats:7, latest:"2026-07-08", rank:"—", points:"—", team:"ROBLOX-LABS"},
  {name:"TJCSC", icon:"📔", solves:20, cats:5, latest:"2026-07-08", rank:"83", points:"8872", team:"ROBLOX-LABS"},
  {name:"THEM 2026", icon:"📄", solves:27, cats:5, latest:"2026-07-08", rank:"38", points:"4810", team:"ROBLOX-LABS"},
];

const toc = {
  "web_exploitation": ["B1tsy Ducky — V1t CTF", "HVL"],
  "cryptography": ["China Crack? - 101", "CuRvE (Kriptografi)", "HexTrap (Kriptografi)", "Rune Dice Casino"],
  "reverse_engineering": ["BootRoot: Root of No R…", "Ducks Ping-Pong", "ShahInRev", "Tiny"],
  "binary_exploitation": ["StaleMate", "StaleMate - Revenge"],
  "misc": ["Atari 2600", "Classless", "Scary Duck"],
  "hardware": ["Barely Legal Experience", "XTS-AES"],
  "forensics": ["BasicQnA Forensics", "Nice Try"]
};

function renderNav(){
  document.getElementById("event-list").innerHTML = events.map(e => `
    <div class="nav-item" data-route="#/event/${e.id}">
      <span class="ic">${e.icon}</span>${e.name}
      <span class="count">${e.writeups}</span>
    </div>
  `).join("");
}

function renderHome(){
  return `
    <div class="col-main">
      <h1 class="page-title">🏠 Home</h1>
      <hr class="divider">
      <p class="lede">A collection of CTF challenge writeups and notes, aimed towards cybersecurity education and technical walk-throughs.</p>
      <p>Welcome to the write-up catalog. Here, we document solutions for various categories including Cryptography, Reverse Engineering, Binary Exploitation, Web Security, Forensics, and more.</p>
      <p class="note">(This archive is regularly updated as new events are completed and analyzed)</p>

      <div class="stat-row">
        <div class="card card-country">
          <div class="flag"></div>
          <div>
            <div class="cc-label">Asal</div>
            <div class="cc-name">Indonesia 🇮🇩</div>
          </div>
        </div>
        <div class="card card-rank">
          <div class="eyebrow">CTFtime Ranking 2026</div>
          <a class="ext-link" href="#">ctftime.org →</a>
          <div class="rank-grid">
            <div><span class="num hot">#2</span><span class="lbl">🇮🇩 INDONESIA</span></div>
            <div><span class="num">#78</span><span class="lbl">🌐 WORLDWIDE</span></div>
            <div><span class="num green">351.20</span><span class="lbl">POINTS</span></div>
            <div><span class="num">111</span><span class="lbl">EVENTS</span></div>
          </div>
        </div>
      </div>

      <h2 class="section-title">CTF Performance &amp; Solves</h2>
      <table>
        <thead>
          <tr><th>Event Name</th><th>Solves</th><th>Categories</th><th>Latest Solved</th><th>Rank/Place</th><th>Points</th><th>Team</th></tr>
        </thead>
        <tbody>
          ${perf.map(p => `
            <tr>
              <td class="ev-name"><span class="ic">${p.icon}</span>${p.name}</td>
              <td>${p.solves}</td>
              <td>${p.cats}</td>
              <td class="mono">${p.latest}</td>
              <td class="${p.rank==='—'?'dash':'rank-strong'} mono">${p.rank}</td>
              <td class="mono">${p.points}</td>
              <td><span class="team-pill">${p.team}</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderEvent(ev){
  return `
    <div class="col-main">
      <p class="breadcrumb-note">Solutions and notes for this event.</p>
      <div class="meta-count">
        <div><span class="n">${ev.writeups}</span><span class="l">writeups</span></div>
        <div><span class="n">${Object.keys(toc).length}</span><span class="l">categoryies</span></div>
      </div>
      <hr class="divider">

      <div class="cat-label">Web</div>
      <h3 class="writeup-title">B1tsy Ducky — ${ev.name}</h3>
      <div class="meta-row">
        <div>CATEGORY: <b>Web</b></div>
        <div>POINTS: <b>0</b></div>
        <div>DIFFICULTY: <b class="diff">Medium</b></div>
        <div>DATE: <b>2026-07-08</b></div>
        <div>AUTHOR: <b>Nattt</b></div>
      </div>

      <div class="cat-label" style="margin-top:0;">Description</div>
      <div class="desc-box">
        Game Bitsy is just the wrapper. The duck's final dialogue triggers a hidden JS function
        called <code>__bdx_17a</code>, which sends three values to the Go/WASM function <code>duckWasmReveal</code>:
        <ol>
          <li><code>document.referrer</code></li>
          <li>serialized <code>ROOM_3</code></li>
          <li>32-digit hex Cloudflare token</li>
        </ol>
        WASM combines all three to derive an HMAC-SHA256 key and SHA-256 nonce, then decrypts the ciphertext
        with AES-256-GCM. The flag check in the WASM wrapper has an off-by-one length bug, so the plaintext
        is read straight from the AES-GCM output.
      </div>

      <div class="step-block">
        <span class="step-tag">STEP 1</span><span class="step-title">Triage</span>
        <p>Relevant files: <span class="inline-code">bitsy.data</span>, <span class="inline-code">duck.wasm</span>, <span class="inline-code">index.js</span>.</p>
      </div>

      <div class="step-block">
        <span class="step-tag">STEP 2</span><span class="step-title">Binary check</span>
        <p>ELF64 PIE with active protections:</p>
        <div class="code-block">
          <button class="copy-btn">COPY</button>
          Full RELRO | Canary found | NX enabled | PIE enabled
        </div>
      </div>

      <div class="step-block">
        <span class="step-tag">STEP 3</span><span class="step-title">Extract the key material</span>
        <div class="code-block">
          <button class="copy-btn">COPY</button>
          open pipe → mirror pipe → derive key → decrypt AES-GCM
        </div>
      </div>

      <div class="flag-box">
        <div class="tag">FLAG</div>
        <div class="val">${ev.id}{n4tt_st4t1c_s1t3_cl0n3d_1n_ch4t}</div>
        <button class="copy-btn">COPY</button>
      </div>
    </div>

    <div class="col-toc">
      <div class="toc-head">On This Page</div>
      ${Object.entries(toc).map(([cat, items]) => `
        <div class="toc-group">
          <div class="toc-cat">${cat}</div>
          ${items.map((it,i) => `<a class="toc-link ${i===0 && cat==='web_exploitation' ? 'active':''}" href="#">${it}</a>`).join("")}
        </div>
      `).join("")}
    </div>
  `;
}

function route(){
  const hash = location.hash || "#/";
  const content = document.getElementById("content");
  const navItems = document.querySelectorAll(".nav-item[data-route]");
  navItems.forEach(n => n.classList.toggle("active", n.dataset.route === hash || (hash === "" && n.dataset.route === "#/")));

  if(hash.startsWith("#/event/")){
    const id = hash.replace("#/event/","");
    const ev = events.find(e => e.id === id) || events[0];
    content.innerHTML = renderEvent(ev);
  } else {
    content.innerHTML = renderHome();
  }
  document.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.onclick = ()=>{ btn.textContent="COPIED"; setTimeout(()=>btn.textContent="COPY",1200); };
  });
}

document.addEventListener("click", (e)=>{
  const item = e.target.closest("[data-route]");
  if(item){ location.hash = item.dataset.route; }
});
window.addEventListener("hashchange", route);

renderNav();
route();
</script>
</body>
</html>
